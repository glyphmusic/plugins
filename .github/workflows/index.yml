name: Index

on:
  pull_request:
    paths: ["plugins/**", "themes/**", "scripts/**", ".github/workflows/index.yml"]
  push:
    branches: [main]
    paths: ["plugins/**", "themes/**", "scripts/**", ".github/workflows/index.yml"]
  workflow_dispatch:
  # Daily: fresh stars and update dates for the catalog.
  schedule:
    - cron: "17 4 * * *"

permissions:
  contents: write

jobs:
  index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: `updated` of the themes in this repo comes from git log.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check entries
        if: github.event_name == 'pull_request'
        run: node scripts/build-index.mjs --check
      - name: Build and commit index.json
        if: github.event_name != 'pull_request'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/build-index.mjs
          # Also catches the first run, when index.json is not tracked yet.
          if [ -z "$(git status --porcelain -- index.json)" ]; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.json
          git commit -m "Rebuild index.json"
          git push
